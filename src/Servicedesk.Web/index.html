<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicedesk</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Anti-FOUC: apply the persisted theme to <html> before any CSS/JS so
      // the first paint matches the user's last choice. Three themes:
      // "steaan" (flat light house style — factory default since v0.0.108),
      // and the Nebula glass theme as "light" / "dark". Mirrors
      // applyTheme() in src/app/ThemeProvider.tsx — keep the two in sync.
      (function () {
        try {
          var t = window.localStorage.getItem("sd-theme");
          if (t !== "light" && t !== "dark") t = "steaan";
          var c = document.documentElement.classList;
          if (t === "dark") c.add("dark");
          if (t === "steaan") c.add("theme-steaan");
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
        } catch (_) {
          /* localStorage blocked — the factory default applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
