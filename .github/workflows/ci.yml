name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (dotnet)
    runs-on: ubuntu-latest
    # Real-PostgreSQL tests (tests/…/Database): each run creates and drops
    # its own sd_test_* database here. With CI=true a missing database fails
    # the run instead of skipping those tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servicedesk_test
          POSTGRES_PASSWORD: servicedesk_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicedesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVICEDESK_TEST_PG: Host=localhost;Port=5432;Username=servicedesk_test;Password=servicedesk_test;Database=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs full git history for tag-based versioning

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Servicedesk.slnx

      - name: Build
        run: dotnet build Servicedesk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Servicedesk.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Servicedesk.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Servicedesk.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: docker (image build + boot smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sd_ci
          POSTGRES_PASSWORD: ci_stub_password
          POSTGRES_DB: servicedesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sd_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs tags for the APP_VERSION build-arg fallback.

      - name: Derive APP_VERSION (SemVer for MinVer override)
        id: ver
        run: |
          # MinVer's --version-override needs a clean SemVer string. git describe
          # produces "v0.0.13-2-gSHA" which MinVer rejects (MINVER1005). We
          # synthesise a CI-scoped pre-release version from the latest tag.
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE=${LATEST_TAG#v}
          SHORT_SHA=$(git rev-parse --short HEAD)
          # "g" prefix (as in git describe): an all-digit short SHA with a
          # leading zero (e.g. 0144545) is an invalid SemVer numeric
          # identifier and MinVer rejects it (MINVER1005).
          echo "value=${BASE}-ci.g${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.ver.outputs.value }}" \
            --tag servicedesk/app:ci \
            .

      - name: Boot container against service-postgres (full smoke)
        run: |
          # --network host lets the container reach the postgres service on
          # localhost:5432 exactly as a VPS install would reach native-host
          # Postgres. ASPNETCORE_URLS=:8080 stays the same — the runner's port
          # is free because GitHub Actions runners give us a fresh host.
          # The raised global API budget is for the e2e flows below only: one
          # browser loads page after page within a minute, far denser than an
          # agent at work, and would trip the 240/min default.
          docker run -d --name sd \
            --network host \
            -e SERVICEDESK_ConnectionStrings__Postgres="Host=127.0.0.1;Port=5432;Database=servicedesk_ci;Username=sd_ci;Password=ci_stub_password" \
            -e SERVICEDESK_Audit__HashKey="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            -e SERVICEDESK_DataProtection__MasterKey="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            -e SERVICEDESK_Security__RateLimit__Global__PermitPerWindow=3000 \
            servicedesk/app:ci

          # Wait up to 60s for the app to boot, bootstrap schema, and answer.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/system/version > /dev/null; then
              echo "boot ok — /api/system/version responded"
              curl -fsS http://127.0.0.1:8080/api/system/version
              exit 0
            fi
            sleep 2
          done

          echo "boot failed — dumping logs:"
          docker logs sd
          exit 1

      # End-to-end smoke flows (src/Servicedesk.Web/e2e) against the booted
      # image on its fresh database: the seed step creates the first admin
      # through the setup wizard, then sign-in with TOTP, ticket create,
      # note + status, bulk edit, global search and the customer portal
      # (invitation → password + TOTP → public reply only) run in a browser.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/Servicedesk.Web/package-lock.json

      - name: Install Playwright
        working-directory: src/Servicedesk.Web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # The portal flow stands in for the invitation mail through psql.
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: End-to-end smoke flows
        working-directory: src/Servicedesk.Web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_PG_URL: postgresql://sd_ci:ci_stub_password@127.0.0.1:5432/servicedesk_ci
        run: npx playwright test

      # Fictitious data only: a throw-away admin on a database that is gone
      # when the runner stops.
      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            src/Servicedesk.Web/e2e/.report
            src/Servicedesk.Web/e2e/.results
          retention-days: 7

      - name: App logs after a failed e2e run
        if: failure()
        run: docker logs sd 2>&1 | tail -200

      - name: Stop container
        if: always()
        run: docker rm -f sd 2>/dev/null || true
